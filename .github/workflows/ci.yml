name: CI Pipeline

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verification and Docker Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: devops_test
      DB_USER: devops_test
      DB_PASSWORD: ci_test_password
      APP_VERSION: "0.4.0"
      PGPASSWORD: postgres

    steps:
      # 1. Получение исходного кода
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Подготовка Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # 3. Установка PostgreSQL client
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_dump --version

      # 4. Создание тестовых баз данных
      - name: Create test databases
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -v test_password="$DB_PASSWORD" <<'SQL'
          CREATE ROLE devops_test LOGIN PASSWORD :'test_password';
          SQL

          for database in \
            devops_test \
            devops_lr3_clean \
            devops_lr3_upgrade \
            devops_lr3_restore
          do
            createdb -h 127.0.0.1 \
              -U postgres \
              -O devops_test \
              "$database"
          done

      # 5. Временные секреты для проверки Docker Compose
      - name: Prepare test secrets
        run: |
          mkdir -p secrets

          for secret in \
            db_password \
            secret_key \
            admin_password \
            postgres_password
          do
            printf '%s\n' 'ci-only-placeholder' \
              > "secrets/${secret}.txt"
          done

      # 6. Установка зависимостей проекта
      - name: Install project dependencies
        run: make setup

      # 7. Полная проверка проекта
      - name: Run project verification
        run: make verify

      # 8. Сборка Docker-образа
      - name: Build Docker image
        run: |
          docker build --pull \
            --tag "devops-app:ci-${GITHUB_SHA}" .

      # 9. Сохранение отчётов
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            reports/junit.xml
            reports/coverage.xml
            reports/htmlcov/
            reports/bandit.json
          if-no-files-found: ignore
          retention-days: 14

      # 10. Авторизация Docker Hub (только main)
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Docker Hub credentials are not configured"
            exit 1
          fi

          printf '%s' "$DOCKERHUB_TOKEN" | \
            docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

      # 11. Публикация образа (только main)
      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/devops-app"

          docker tag "devops-app:ci-${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
          docker tag "devops-app:ci-${GITHUB_SHA}" "${IMAGE}:latest"

          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
