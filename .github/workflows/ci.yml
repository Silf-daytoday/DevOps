
name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"

  pull_request:
    branches:
      - develop
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # 1. Проверка качества кода
  quality:
    name: Code Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: make setup

      - name: Run code quality checks
        run: make quality

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: reports/bandit.json
          if-no-files-found: ignore
          retention-days: 14

  # 2. Автоматические тесты
  tests:
    name: Automated Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: devops_test
      DB_USER: devops_test
      DB_PASSWORD: ci_test_password
      APP_VERSION: "0.4.0"
      PGPASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Create isolated test databases
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -v test_password="$DB_PASSWORD" <<'SQL'
          CREATE ROLE devops_test LOGIN PASSWORD :'test_password';
          SQL

          for database in \
            devops_test \
            devops_lr3_clean \
            devops_lr3_upgrade \
            devops_lr3_restore
          do
            createdb -h 127.0.0.1 \
              -U postgres \
              -O devops_test \
              "$database"
          done

      - name: Prepare test secrets
        run: |
          mkdir -p secrets

          for secret in \
            db_password \
            secret_key \
            admin_password \
            postgres_password
          do
            printf '%s\n' 'ci-only-placeholder' \
              > "secrets/${secret}.txt"
          done

      - name: Install project dependencies
        run: make setup

      - name: Run automated tests
        run: make test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            reports/junit.xml
            reports/coverage.xml
            reports/htmlcov/
          if-no-files-found: ignore
          retention-days: 14

  # 3. Миграции и резервное копирование
  database:
    name: Database Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: devops_test
      DB_USER: devops_test
      DB_PASSWORD: ci_test_password
      APP_VERSION: "0.4.0"
      PGPASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Create test databases
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -v test_password="$DB_PASSWORD" <<'SQL'
          CREATE ROLE devops_test LOGIN PASSWORD :'test_password';
          SQL

          for database in \
            devops_test \
            devops_lr3_clean \
            devops_lr3_upgrade \
            devops_lr3_restore
          do
            createdb -h 127.0.0.1 \
              -U postgres \
              -O devops_test \
              "$database"
          done

      - name: Prepare test secrets
        run: |
          mkdir -p secrets

          for secret in \
            db_password \
            secret_key \
            admin_password \
            postgres_password
          do
            printf '%s\n' 'ci-only-placeholder' \
              > "secrets/${secret}.txt"
          done

      - name: Install project dependencies
        run: make setup

      - name: Check database migrations
        run: make migration-check

      - name: Check backup and restore
        run: make backup-check

      - name: Run mutation testing
        run: make mutation

  # 4. Проверки безопасности
  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pip-audit
        run: |
          python -m pip install --disable-pip-version-check \
            "pip-audit==2.10.1"

      - name: Audit Python dependencies
        run: |
          mkdir -p reports

          python -m pip_audit \
            --strict \
            -r requirements-dev.txt \
            --format json \
            --output reports/pip-audit.json

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: reports/pip-audit.json
          if-no-files-found: ignore
          retention-days: 14

  # 5. Контейнерные проверки
  container:
    name: Container Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare test secrets
        run: |
          mkdir -p secrets

          for secret in \
            db_password \
            secret_key \
            admin_password \
            postgres_password
          do
            printf '%s\n' 'ci-only-placeholder' \
              > "secrets/${secret}.txt"
          done

      - name: Check container configuration
        run: make container-check

  # 6. Сборка и анализ Docker-образа
  build_scan:
    name: Build and Image Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    needs:
      - quality
      - tests
      - database
      - security
      - container

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build --pull \
            --tag "devops-app:ci-${GITHUB_SHA}" .

      - name: Prepare reports
        if: always()
        run: mkdir -p reports

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: devops-app:ci-${{ github.sha }}
          format: json
          output: reports/trivy-image.json
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload image security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-security-reports
          path: reports/trivy-image.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save verified Docker image
        run: |
          docker save \
            "devops-app:ci-${GITHUB_SHA}" \
            --output docker-image.tar

      - name: Upload verified Docker image
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-${{ github.sha }}
          path: docker-image.tar
          retention-days: 1

  # 7. Публикация Docker Hub
  publish:
    name: Publish Docker Image
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    needs:
      - quality
      - tests
      - database
      - security
      - container
      - build_scan


	if: >-
  	  github.event_name == 'push' &&
  	  github.ref == 'refs/heads/main' &&
  	  needs.quality.result == 'success' &&
  	  needs.tests.result == 'success' &&
  	  needs.database.result == 'success' &&
  	  needs.security.result == 'success' &&
  	  needs.container.result == 'success' &&
  	  needs.build_scan.result == 'success'


    steps:
      - name: Download verified Docker image
        uses: actions/download-artifact@v8.0.2
        with:
          name: docker-image-${{ github.sha }}
          path: /tmp/docker-image

      - name: Load Docker image
        run: |
          docker load --input /tmp/docker-image/docker-image.tar

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Docker Hub credentials are not configured"
            exit 1
          fi

          printf '%s' "$DOCKERHUB_TOKEN" | \
            docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

      - name: Publish image with commit SHA
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/devops-app"

          docker tag \
            "devops-app:ci-${GITHUB_SHA}" \
            "${IMAGE}:${GITHUB_SHA}"

          docker push "${IMAGE}:${GITHUB_SHA}"