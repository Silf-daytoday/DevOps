services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-app:0.5.0
    container_name: devops-app
    restart: unless-stopped
    init: true

    environment:
      DB_HOST: "192.168.40.136"
      DB_PORT: "5432"
      DB_NAME: "devops"
      DB_USER: "devops_app"
      PORT: "5000"
      APP_VERSION: "0.5.0"

    secrets:
      - db_password
      - secret_key
      - admin_password

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export DB_PASSWORD="$$(cat /run/secrets/db_password)"
        export SECRET_KEY="$$(cat /run/secrets/secret_key)"
        export ADMIN_PASSWORD="$$(cat /run/secrets/admin_password)"
        exec gunicorn \
          --bind=0.0.0.0:5000 \
          --workers=2 \
          --graceful-timeout=30 \
          --timeout=60 \
          --access-logfile=- \
          --error-logfile=- \
          app:app

    ports:
      - "192.168.40.135:5000:5000"

    cpus: 1.0
    mem_limit: 1g
    pids_limit: 100

    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    stop_grace_period: 40s

secrets:
  db_password:
    file: ./secrets/db_password.txt
  secret_key:
    file: ./secrets/secret_key.txt
  admin_password:
    file: ./secrets/admin_password.txt
