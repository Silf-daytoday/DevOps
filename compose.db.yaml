services:
  db:
    image: postgres:16.15-bookworm
    container_name: devops-db
    restart: unless-stopped
    init: true

    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"

    secrets:
      - postgres_password
      - db_password

    ports:
      - "192.168.40.136:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/00-create-database.sql:/docker-entrypoint-initdb.d/10-create-database.sql:ro
      - ./deploy/01-apply-schema.sql:/docker-entrypoint-initdb.d/20-apply-schema.sql:ro
      - ./schema.sql:/schema.sql:ro
      - ./container/db/init/30-set-app-password.sh:/docker-entrypoint-initdb.d/30-set-app-password.sh:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    cpus: 1.0
    mem_limit: 1536m
    pids_limit: 100
    stop_grace_period: 1m

    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  db_password:
    file: ./secrets/db_password.txt
